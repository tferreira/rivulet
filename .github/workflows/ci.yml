name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
        redis: ['7.4', '6.2']
    services:
      redis:
        image: redis:${{ matrix.redis }}
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          REDIS_URL: redis://127.0.0.1:6379

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rivulet:ci .
      - run: docker run --rm rivulet:ci --version
